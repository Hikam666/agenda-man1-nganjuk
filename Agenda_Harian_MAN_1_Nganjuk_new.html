<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Harian MAN 1 Nganjuk</title>
<style>
:root{--bg:#e8eef5;--card:#fff;--tx:#152033;--mu:#5b6b7e;--pr:#1f5fa8;--pr2:#e3edf9;--bd:#d6e0ec;--wa:#b45309;--wab:#fef3c7;--er:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1420;--card:#142033;--tx:#e6edf7;--mu:#9fb0c6;--pr:#6aa8f0;--pr2:#1c3050;--bd:#2a3d58;--wa:#fbbf24;--wab:#3a2e0c;--er:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1420;--card:#142033;--tx:#e6edf7;--mu:#9fb0c6;--pr:#6aa8f0;--pr2:#1c3050;--bd:#2a3d58;--wa:#fbbf24;--wab:#3a2e0c;--er:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
.w{max-width:720px;margin:0 auto;padding:0 14px}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 0}
header .w{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:19px;margin:0;line-height:1.2}header small{color:var(--mu);font-size:13px}
.who{border:0;border-radius:20px;padding:9px 14px;font:600 13px inherit;background:var(--pr2);color:var(--pr);max-width:55%;text-align:right;cursor:pointer}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{flex:1;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:600 15px inherit;cursor:pointer}
.tab.on{background:var(--pr);color:#fff;border-color:var(--pr)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab.on{color:#06101f}}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nav b{flex:1;text-align:center;font-size:16px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px;cursor:pointer}
.today{height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--pr);background:var(--pr2);color:var(--pr);font:600 14px inherit;cursor:pointer}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.fl input{grid-column:1/-1}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:16px inherit}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px;font-weight:600}
.dh{font-weight:700;color:var(--pr);margin:16px 0 6px;font-size:15px}
.c{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--pr);border-radius:12px;padding:12px;margin-bottom:10px}
.c.st-Selesai{opacity:.8}.c.st-Dibatalkan{opacity:.6;border-left-color:var(--mu)}.c.st-Dibatalkan .t{text-decoration:line-through}
.tm{font-weight:700;color:var(--pr);font-size:14px}.t{font-weight:700;font-size:17px;margin:2px 0}
.m{color:var(--mu);font-size:14px}.m span{display:block}
.ch{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--pr2);color:var(--pr);margin-right:4px}
.ch.s{background:var(--bd);color:var(--tx)}
.bt{background:var(--wab);color:var(--wa);padding:6px 9px;border-radius:8px;font-size:13px;margin-top:6px;font-weight:600}
.hs{background:var(--pr2);border-radius:8px;padding:8px;margin-top:8px;font-size:14px}
.ac{display:flex;gap:8px;margin-top:10px}
.b{padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 14px inherit;cursor:pointer}
.b.p{background:var(--pr);color:#fff;border-color:var(--pr)}.b.d{color:var(--er)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b.p{color:#06101f}}
.em{text-align:center;color:var(--mu);padding:30px 10px;border:1px dashed var(--bd);border-radius:12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pr);color:#fff;border:0;border-radius:30px;padding:16px 22px;font:700 16px inherit;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;z-index:5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{color:#06101f}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh h2{margin:0 0 4px;font-size:18px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pk{display:block;width:100%;text-align:left;padding:12px;margin-bottom:6px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:15px inherit;cursor:pointer}
.pk.on{border-color:var(--pr);background:var(--pr2)}.pk small{color:var(--mu)}
.gh{font-size:12px;color:var(--mu);font-weight:700;text-transform:uppercase;margin:10px 0 4px}
.bn{background:var(--wab);color:var(--wa);padding:10px;border-radius:10px;margin-bottom:10px;font-size:14px}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:20px}
@media print{header .who,.tabs,.nav .ib,.today,.fl,.fab,.ac,.ov{display:none!important}body{background:#fff;color:#000}.c{break-inside:avoid}}
.app{display:flex;min-height:100vh}.sb{display:none}main{flex:1;min-width:0}
.hl{display:flex;align-items:center;gap:10px}.hl img{width:38px;height:auto}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(20,40,70,.06)}
.cd h2{margin:0 0 4px;font-size:18px}
.g2{display:grid;gap:10px;margin:12px 0 10px}.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.st b{display:block;font-size:30px;line-height:1.1;margin:4px 0 8px}.st .b{padding:6px 12px;font-size:13px}
.bars{display:flex;gap:8px;height:210px;margin-top:10px;border-bottom:1px solid var(--bd)}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bn2{height:18px;font-size:12px;font-weight:700;color:var(--mu)}
.bs{flex:1;width:100%;max-width:48px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden}
.bs i{display:block;width:100%}
.bls{display:flex;gap:8px;margin-top:4px}.bls div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.bls .tdy{color:var(--pr);font-weight:700}
.lgd{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--mu)}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.sb .lg{display:flex;align-items:center;gap:10px;margin-bottom:18px}.sb .lg img{width:50px;height:auto}.sb .lg b{font-size:16px}.sb .lg small{display:block;color:var(--mu);font-size:12px}
.sb nav button,.lo{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:4px;border:0;border-radius:12px;background:transparent;color:var(--tx);font:600 15px inherit;cursor:pointer}
.sb nav button.on{background:var(--pr2);color:var(--pr)}.lo{margin-top:auto;margin-bottom:0;border:1px solid var(--bd)}
@media (min-width:900px){.sb{display:flex;flex-direction:column;width:240px;flex:none;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--bd);padding:18px 12px}.tabs,.hl img{display:none}.w{max-width:1000px;padding:0 22px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:2fr 1fr}.bars{height:260px}}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mh{text-align:center;font-size:12px;font-weight:700;color:var(--mu);padding:2px 0}
.md{min-height:58px;min-width:0;border:1px solid var(--bd);border-radius:10px;background:var(--card);padding:5px;font:inherit;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.md b{font-size:14px}.md.o{opacity:.4}.md.td b{color:var(--pr);text-decoration:underline}.md.sel{border-color:var(--pr);background:var(--pr2);box-shadow:inset 0 0 0 1px var(--pr)}
.dt{display:flex;flex-wrap:wrap;gap:2px}.dt i{display:block;width:8px;height:8px;border-radius:50%}.md small{font-size:11px;color:var(--mu)}
@media (min-width:900px){.md{min-height:82px}}
@media print{.sb,header,.tabs{display:none!important}}
</style>
</head>

<script>
const JAB=[["kamad","Kepala Madrasah"],["ktu","KTU"],["akd","Waka Akademik"],["sis","Waka Kesiswaan"],["sar","Waka Sarana Prasarana"],["hum","Waka Kehumasan"]];
const KAT=["Rapat","KBM/Ujian","Kesiswaan","Keagamaan","Kunjungan/Tamu","Dinas Luar","Lainnya"];
const STA=["Terjadwal","Berlangsung","Selesai","Dibatalkan"];
const ROLES=[];JAB.forEach(([k,n])=>[0,1,2].forEach(l=>ROLES.push({key:k+l,j:k,l,n:l?"Asisten "+n+" "+l:n,jn:n})));
const rn=k=>(ROLES.find(r=>r.key===k)||{n:"—"}).n;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=s=>new Date(s+"T00:00:00");
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=(s,o)=>pd(s).toLocaleDateString("id-ID",o||{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const monday=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const on=(a,d)=>a.tgl<=d&&d<=(a.tglEnd||a.tgl);
const tmin=t=>{const[a,b]=(t||"0:0").split(":");return +a*60+ +b};
let S={v:"d",date:iso(new Date()),all:[],who:null,db:null,edit:null,del:null};
try{S.who=localStorage.getItem("who")}catch(e){}
if(!ROLES.find(r=>r.key===S.who))S.who=null;

function opts(el,arr,first){el.innerHTML=(first?'<option value="">'+first+'</option>':"")+arr.map(a=>Array.isArray(a)?'<option value="'+a[0]+'">'+a[1]+'</option>':'<option>'+a+'</option>').join("")}
opts($("#fj"),JAB.map(j=>[j[0],j[1]]),"Semua jabatan");opts($("#fk"),KAT,"Semua kategori");opts($("#fs"),STA,"Semua status");
opts($("#f-k"),KAT);opts($("#f-s"),STA);

function conflicts(a,list){
  return list.filter(b=>b.id!==a.id&&b.tgl<=(a.tglEnd||a.tgl)&&a.tgl<=(b.tglEnd||b.tgl)&&b.status!=="Dibatalkan"&&a.status!=="Dibatalkan"&&tmin(a.mulai)<tmin(b.selesai||b.mulai)+(b.selesai?0:1)&&tmin(b.mulai)<tmin(a.selesai||a.mulai)+(a.selesai?0:1)&&(b.owner===a.owner||(a.lokasi&&b.lokasi&&a.lokasi.trim().toLowerCase()===b.lokasi.trim().toLowerCase())));
}
function filt(){
  const q=$("#q").value.toLowerCase(),fj=$("#fj").value,fk=$("#fk").value,fs=$("#fs").value;
  return S.all.filter(a=>(!fj||a.owner.startsWith(fj))&&(!fk||a.kat===fk)&&(!fs||a.status===fs)&&(!q||[a.judul,a.lokasi,a.peserta,a.ket,rn(a.owner)].join(" ").toLowerCase().includes(q)))
   .sort((a,b)=>(a.tgl+a.mulai).localeCompare(b.tgl+b.mulai));
}
function card(a){
  const mine=a.owner===S.who,cf=conflicts(a,S.all);
  return '<div class="c st-'+a.status+'"><div class="tm">'+(a.tglEnd&&a.tglEnd>a.tgl?fmt(a.tgl,{day:"numeric",month:"short"})+" – "+fmt(a.tglEnd,{day:"numeric",month:"short"})+" · ":"")+esc(a.mulai)+(a.selesai?" – "+esc(a.selesai):"")+' WIB</div><div class="t">'+esc(a.judul)+'</div>'
  +'<div><span class="ch">'+esc(a.kat)+'</span><span class="ch s">'+esc(a.status)+'</span></div>'
  +'<div class="m"><span>📍 '+esc(a.lokasi||"—")+'</span><span>👤 '+esc(rn(a.owner))+'</span>'+(a.peserta?'<span>👥 '+esc(a.peserta)+'</span>':"")+(a.ket?'<span>'+esc(a.ket)+'</span>':"")+'</div>'
  +(cf.length?'<div class="bt">⚠ Bentrok dengan: '+cf.map(x=>esc(x.judul)).join(", ")+'</div>':"")
  +(a.hasil?'<div class="hs"><b>Hasil:</b> '+esc(a.hasil)+'</div>':"")
  +((mine||a.status==="Dibatalkan")?'<div class="ac">'+(mine?'<button class="b" data-e="'+a.id+'">Ubah</button>':"")+'<button class="b d" data-d="'+a.id+'">'+(S.del===a.id?"Yakin hapus? Ketuk lagi":(a.status==="Dibatalkan"?"🗑 Hapus agenda batal":"Hapus"))+'</button></div>':"")+'</div>';
}
const COL={"Rapat":"#1f5fa8","KBM/Ujian":"#e0a100","Kesiswaan":"#2e9e6b","Keagamaan":"#8b5cf6","Kunjungan/Tamu":"#e5603d","Dinas Luar":"#0ea5b7","Lainnya":"#8794a6"};
function renderDash(){
  const td=iso(new Date()),m=monday(td),wk=[0,1,2,3,4,5].map(i=>addD(m,i)),A=S.all;
  const tdA=A.filter(a=>on(a,td)).sort((a,b)=>a.mulai.localeCompare(b.mulai)),wA=A.filter(a=>wk.some(d=>on(a,d)));
  const cf=wA.filter(a=>conflicts(a,A).length).length;
  const n=new Date(),now=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  const nx=tdA.find(a=>a.status!=="Dibatalkan"&&(a.selesai||a.mulai)>=now);
  const mx=Math.max(1,...wk.map(d=>wA.filter(a=>on(a,d)).length));
  const bars=wk.map(d=>{const L=wA.filter(a=>on(a,d));return '<div class="bc"><div class="bn2">'+(L.length||"")+'</div><div class="bs">'+KAT.map(k=>{const c=L.filter(a=>a.kat===k).length;return c?'<i style="height:'+(c/mx*100)+'%;background:'+COL[k]+'" title="'+k+': '+c+'"></i>':""}).join("")+'</div></div>'}).join("");
  const lbl=wk.map(d=>'<div'+(d===td?' class="tdy"':'')+'>'+fmt(d,{weekday:"short"})+'</div>').join("");
  $("#dash").innerHTML='<div class="g2"><div class="cd"><h2>Selamat datang di Dashboard</h2><div class="m">'+fmt(td)+'</div><div class="m">'+(S.who?"Masuk sebagai "+esc(rn(S.who)):"Pilih jabatan di kanan atas untuk mengisi agenda")+'</div></div>'
  +'<div class="cd"><div class="m">Agenda berikutnya</div>'+(nx?'<div class="t">'+esc(nx.judul)+'</div><div class="m">'+esc(nx.mulai)+" · "+esc(nx.lokasi||"—")+"</div>":'<div class="t">Tidak ada</div>')+'</div></div>'
  +'<div class="g4">'+[["Agenda Hari Ini",tdA.length,"h"],["Agenda Pekan Ini",wA.length,"p"],["Selesai Pekan Ini",wA.filter(a=>a.status==="Selesai").length,"p"],["Jadwal Bentrok",cf,"p"]].map(x=>'<div class="cd st"><div class="m">'+x[0]+"</div><b>"+x[1]+'</b><button class="b" data-go="'+x[2]+'">Lihat</button></div>').join("")+"</div>"
  +'<div class="cd" style="margin-bottom:10px"><h2>Grafik Agenda Pekan Ini</h2><div class="bars">'+bars+'</div><div class="bls">'+lbl+'</div><div class="lgd">'+KAT.map(k=>'<span><i style="background:'+COL[k]+'"></i>'+k+"</span>").join("")+"</div></div>"
  +'<div class="dh">Agenda Hari Ini</div>'+(tdA.length?tdA.map(card).join(""):'<div class="em">Belum ada agenda hari ini.</div>');
}
function render(){
  $("#who").textContent=S.who?rn(S.who)+" ▾":"Pilih jabatan ▾";
  document.querySelectorAll(".tab,#nv button[data-v]").forEach(t=>t.classList.toggle("on",t.dataset.v===S.v));
  $("#dash").style.display=S.v==="d"?"":"none";$("#agw").style.display=S.v==="d"?"none":"";$("#pt").textContent={d:"Dashboard",h:"Agenda Hari Ini",p:"Agenda Pekan",b:"Agenda Bulanan"}[S.v];if(S.v==="d"){renderDash();return}const list=filt();let h="";
  if(S.v==="h"){
    $("#dl").textContent=fmt(S.date)+(S.date===iso(new Date())?" · Hari ini":"");
    const L=list.filter(a=>on(a,S.date));
    h=L.length?L.map(card).join(""):'<div class="em">Belum ada agenda pada hari ini.<br>Ketuk “+ Agenda” untuk menambahkan.</div>';
  }else if(S.v==="b"){
    const f=pd(S.date);f.setDate(1);const mo=f.getMonth(),st=monday(iso(f)),td=iso(new Date()),cells=[];
    for(let i=0;i<42;i++){const d=addD(st,i);if(i%7===0&&i>=28&&pd(d).getMonth()!==mo)break;cells.push(d)}
    $("#dl").textContent=fmt(S.date,{month:"long",year:"numeric"});
    h='<div class="mg">'+["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(x=>'<div class="mh">'+x+'</div>').join("")+cells.map(d=>{const L=list.filter(a=>on(a,d));return '<button class="md'+(pd(d).getMonth()!==mo?" o":"")+(d===td?" td":"")+(d===S.date?" sel":"")+'" data-day="'+d+'"><b>'+pd(d).getDate()+'</b>'+(L.length?'<span class="dt">'+L.slice(0,4).map(a=>'<i style="background:'+COL[a.kat]+'"></i>').join("")+'</span>'+(L.length>4?'<small>+'+(L.length-4)+'</small>':''):'')+'</button>'}).join("")+'</div>';
    const D=list.filter(a=>on(a,S.date));
    h+='<div class="dh">'+fmt(S.date)+'</div>'+(D.length?D.map(card).join(""):'<div class="em">Tidak ada agenda pada tanggal ini.</div>');
  }else{
    const m=monday(S.date);
    $("#dl").textContent=fmt(m,{day:"numeric",month:"short"})+" – "+fmt(addD(m,5),{day:"numeric",month:"short",year:"numeric"});
    for(let i=0;i<6;i++){const d=addD(m,i),L=list.filter(a=>on(a,d));h+='<div class="dh">'+fmt(d,{weekday:"long",day:"numeric",month:"long"})+"</div>"+(L.length?L.map(card).join(""):'<div class="m" style="margin-bottom:6px">Tidak ada agenda</div>')}
  }
  $("#ls").innerHTML=h;
}
document.querySelectorAll(".tab,#nv button").forEach(t=>t.onclick=()=>{const v=t.dataset.v;if(v){S.v=v;render()}else if(t.dataset.a==="add")openForm();else if(t.dataset.a==="csv")dlCsv();else{try{window.print()}catch(e){}}});
const mv=n=>{if(S.v==="b"){const d=pd(S.date);d.setDate(1);d.setMonth(d.getMonth()+n);S.date=iso(d)}else S.date=addD(S.date,n*(S.v==="h"?1:7));render()};
$("#pv").onclick=()=>mv(-1);
$("#nx").onclick=()=>mv(1);
$("#td").onclick=()=>{S.date=iso(new Date());render()};
["#q","#fj","#fk","#fs"].forEach(s=>$(s).oninput=render);
$("#pr").onclick=()=>{try{window.print()}catch(e){}};
$("#csv").onclick=()=>dlCsv();

async function dlCsv(){
  const note=t=>{$("#bn").innerHTML='<div class="bn">'+t+'</div>';setTimeout(()=>{$("#bn").innerHTML=""},6000)};
  if(!S.all.length){note("Belum ada agenda untuk diunduh.");return}
  const cell=v=>{v=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const head=["Tanggal Mulai","Tanggal Selesai","Jam Mulai","Jam Selesai","Kegiatan","Kategori","Lokasi","Penanggung Jawab","Peserta","Keterangan","Status","Catatan Hasil"];
  const rows=S.all.slice().sort((a,b)=>(a.tgl+a.mulai).localeCompare(b.tgl+b.mulai)).map(a=>[a.tgl,a.tglEnd||a.tgl,a.mulai,a.selesai,a.judul,a.kat,a.lokasi,rn(a.owner),a.peserta,a.ket,a.status,a.hasil].map(cell).join(","));
  const csv="\ufeff"+[head.map(cell).join(",")].concat(rows).join("\r\n");
  try{
    const d=await claude.use("downloads");
    if(!d){note("Unduh belum tersedia di perangkat ini. Gunakan tombol Cetak lalu simpan sebagai PDF.");return}
    await d.save({filename:"agenda-man1-nganjuk-"+iso(new Date())+".csv",data:csv});
    note("Berkas CSV disiapkan. Buka dengan Excel atau Google Sheets.");
  }catch(e){if(!e||e.code!=="declined")note("Gagal mengunduh"+(e&&e.message?": "+esc(e.message):"")+".")}
}
function pickWho(){
  let h="";JAB.forEach(([k,n])=>{h+='<div class="gh">'+n+"</div>"+[0,1,2].map(l=>{const r=ROLES.find(x=>x.key===k+l);return '<button class="pk'+(S.who===r.key?" on":"")+'" data-w="'+r.key+'">'+esc(r.n)+(l?"":" <small>(pejabat utama)</small>")+"</button>"}).join("")});
  $("#wl").innerHTML=h;$("#ovw").classList.add("on");
}
$("#who").onclick=pickWho;$("#w-c").onclick=()=>$("#ovw").classList.remove("on");
$("#wl").onclick=e=>{const b=e.target.closest("[data-w]");if(!b)return;S.who=b.dataset.w;try{localStorage.setItem("who",S.who)}catch(x){}$("#ovw").classList.remove("on");render();if(S.pend){S.pend();S.pend=null}};

function openForm(a){
  if(!S.who){S.pend=()=>openForm(a);pickWho();return}
  S.edit=a?a.id:null;
  $("#ft").textContent=a?"Ubah Agenda":"Tambah Agenda";
  $("#fw").textContent="Penanggung jawab: "+rn(a?a.owner:S.who);
  $("#f-j").value=a?a.judul:"";$("#f-t").value=a?a.tgl:S.date;$("#f-t2").value=a?(a.tglEnd||a.tgl):S.date;$("#f-k").value=a?a.kat:KAT[0];
  $("#f-m").value=a?a.mulai:"07:00";$("#f-e").value=a?a.selesai||"":"08:00";
  $("#f-l").value=a?a.lokasi||"":"";$("#f-p").value=a?a.peserta||"":"";$("#f-ket").value=a?a.ket||"":"";
  $("#f-s").value=a?a.status:"Terjadwal";$("#f-h").value=a?a.hasil||"":"";
  $("#f-b").style.display="none";S.warned=false;$("#ovf").classList.add("on");
}
$("#add").onclick=()=>openForm();
$("#f-t").onchange=()=>{if($("#f-t2").value<$("#f-t").value)$("#f-t2").value=$("#f-t").value};
$("#f-c").onclick=()=>$("#ovf").classList.remove("on");
$("#f-ok").onclick=async()=>{
  const cur=S.edit?S.all.find(x=>x.id===S.edit):null;
  const a={id:S.edit||"",judul:$("#f-j").value.trim(),tgl:$("#f-t").value,tglEnd:$("#f-t2").value||$("#f-t").value,kat:$("#f-k").value,mulai:$("#f-m").value,selesai:$("#f-e").value,lokasi:$("#f-l").value.trim(),peserta:$("#f-p").value.trim(),ket:$("#f-ket").value.trim(),status:$("#f-s").value,hasil:$("#f-h").value.trim(),owner:cur?cur.owner:S.who};
  const bn=$("#f-b");
  if(!a.judul||!a.tgl||!a.mulai){bn.style.display="block";bn.textContent="Isi kegiatan, tanggal, dan jam mulai terlebih dahulu.";return}
  if(a.tglEnd<a.tgl){bn.style.display="block";bn.textContent="Tanggal selesai tidak boleh sebelum tanggal mulai.";return}
  if(a.selesai&&tmin(a.selesai)<=tmin(a.mulai)){bn.style.display="block";bn.textContent="Jam selesai harus setelah jam mulai.";return}
  const cf=conflicts(a,S.all);
  if(cf.length&&!S.warned){S.warned=true;bn.style.display="block";bn.innerHTML="⚠ Bentrok dengan: "+cf.map(x=>esc(x.judul)+" ("+esc(x.mulai)+", "+esc(rn(x.owner))+")").join("; ")+"<br>Ketuk Simpan lagi jika tetap ingin menyimpan.";return}
  if(!S.db){bn.style.display="block";bn.textContent="Penyimpanan bersama belum tersedia. Buka lewat akun claude.ai yang diberi akses.";return}
  const {id,...data}=a;
  try{
    if(S.edit)await S.db.doc("agenda/"+S.edit).set(data);else await S.db.collection("agenda").add(data);
    $("#ovf").classList.remove("on");
  }catch(e){bn.style.display="block";bn.textContent="Gagal menyimpan: "+(e&&e.message||"coba lagi")}
};
$("#ls").onclick=async e=>{
  const dy=e.target.closest("[data-day]");if(dy){S.date=dy.dataset.day;render();return}
  const eb=e.target.closest("[data-e]"),db=e.target.closest("[data-d]");
  if(eb){const a=S.all.find(x=>x.id===eb.dataset.e);if(a)openForm(a)}
  if(db){const id=db.dataset.d,a=S.all.find(x=>x.id===id);if(!a)return;
    const ask=()=>{S.del=id;render();setTimeout(()=>{if(S.del===id){S.del=null;render()}},4000)};
    if(!S.who){S.pend=ask;pickWho();return}
    if(!(a.owner===S.who||a.status==="Dibatalkan"))return;
    if(S.del!==id)ask();
    else{S.del=null;
      const note=t=>{$("#bn").innerHTML='<div class="bn">'+t+'</div>';setTimeout(()=>{$("#bn").innerHTML=""},6000)};
      if(!S.db){render();note("Penyimpanan bersama belum tersedia, agenda belum bisa dihapus.");return}
      try{await S.db.doc("agenda/"+id).delete();note("Agenda “"+esc(a.judul)+"” sudah dihapus.")}catch(x){note("Gagal menghapus: "+esc(x&&x.message||"coba lagi"))}
      render()}}
};
$("#ovf").onclick=e=>{if(e.target.id==="ovf")$("#ovf").classList.remove("on")};
$("#dash").onclick=e=>{const g=e.target.closest("[data-go]");if(g){S.v=g.dataset.go;render();return}$("#ls").onclick(e)};
$("#lo").onclick=pickWho;

(async()=>{
  render();
  let db=null;try{db=await claude.use("db")}catch(e){}
  if(!db){$("#bn").innerHTML='<div class="bn">Data bersama belum tersambung. Buka halaman ini dari akun claude.ai yang sudah diberi akses agar agenda dapat dilihat dan diisi bersama.</div>';return}
  S.db=db;
  db.collection("agenda").onSnapshot(s=>{S.all=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},e=>{$("#bn").innerHTML='<div class="bn">Gagal memuat agenda: '+esc(e&&e.message)+"</div>"});
})();
</script>
</body>
</html>
